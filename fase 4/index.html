<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 04 - Hidratación y Smoke Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #0a0f14; color: #f8fafc; font-family: sans-serif; }
        .card-box { background: #121a21; border: 1px solid #2a3744; padding: 20px; border-radius: 8px; }
        .btn-neon { background: #10b981; color: #000; font-weight: bold; border: none; padding: 10px 20px; }
        .btn-neon:hover { background: #059669; color: #fff; }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1 class="text-success">Fase 04: Hidratación y Smoke Test</h1>
        
        <div class="card-box mt-4">
            <h3>Simulación de Carga</h3>
            <p>Haz clic para simular la hidratación de los eventos de reservas y ejecutar la auditoría de errores.</p>
            
            <button id="btnHidratar" class="btn-neon mb-2">Simular Hidratación</button>
            <p id="estadoHidratacion" class="text-muted">Estado: Esperando acción...</p>
            
            <hr class="border-secondary">
            
            <button id="btnSmokeTest" class="btn btn-warning fw-bold">Ejecutar Smoke Test DOM</button>
            <p id="salidaAudit" class="mt-3 text-info fw-bold" role="status" aria-live="polite"></p>
        </div>
        
        <a href="../index.html" class="btn btn-outline-light mt-4">Volver al Menú</a>
    </main>

    <script>
        // Simulación de Hidratación
        document.getElementById('btnHidratar').addEventListener('click', function() {
            const txt = document.getElementById('estadoHidratacion');
            txt.textContent = "⏳ Hidratando componentes...";
            this.disabled = true;
            setTimeout(() => {
                txt.textContent = "✅ Componentes hidratados correctamente.";
                this.disabled = false;
            }, 1500);
        });

        // Smoke Test DOM
        document.getElementById('btnSmokeTest').addEventListener('click', () => {
            const imgsSinAlt = document.querySelectorAll('img:not([alt]), img[alt=""]').length;
            const enlacesVacios = document.querySelectorAll('a[href=""], a:not([href])').length;
            const botones = document.querySelectorAll('button').length;
            
            document.getElementById('salidaAudit').textContent = 
                `Smoke Test OK · Botones: ${botones} | Imágenes sin alt: ${imgsSinAlt} | Enlaces vacíos: ${enlacesVacios}`;
        });
    </script>
</body>
</html>

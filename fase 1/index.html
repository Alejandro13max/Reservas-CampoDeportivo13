<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 01 - DOM y Semántica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0f14; color: #f8fafc; padding: 20px; font-family: sans-serif; }
        .card-cancha { background: #121a21; border: 1px solid #2a3744; padding: 20px; border-radius: 8px; }
        .btn-neon { background: #10b981; color: #000; font-weight: bold; border: none; padding: 10px 20px; margin-top: 10px; }
        .btn-neon:hover { background: #059669; color: #fff; }
        :focus-visible { outline: 3px solid #10b981; outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1 class="text-success">Fase 01: DOM y Semántica HTML5</h1>
        <p>Esta sección prueba el uso correcto de etiquetas semánticas (header, main, section, article) y auditoría en vivo.</p>
        
        <article class="card-cancha mt-4">
            <header>
                <h3>Cancha de Fútbol 5 - Central</h3>
                <p class="text-muted">Superficie Sintética</p>
            </header>
            <section>
                <p>Precio: Bs. 120 / hora</p>
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='#2a3744'/></svg>" alt="Imagen de la cancha de fútbol central" width="100">
            </section>
            <footer>
                <button id="btnAuditarA11Y" class="btn-neon btn-tactil">Verificar Semántica HTML5</button>
            </footer>
            <p id="reporteA11Y" class="mt-3 text-info fw-bold" role="status" aria-live="polite"></p>
        </article>
        
        <a href="../index.html" class="btn btn-outline-light mt-4">Volver al Menú</a>
    </main>

    <script>
        document.getElementById('btnAuditarA11Y').addEventListener('click', () => {
            const zonas  = document.querySelectorAll('header, nav, main, article, footer, section').length;
            const sinAlt = document.querySelectorAll('img:not([alt]), img[alt=""]').length;
            const labels = document.querySelectorAll('label[for]').length;
            document.getElementById('reporteA11Y').textContent = 
                `Auditoría en vivo: ${zonas} etiquetas semánticas | Imágenes sin alt: ${sinAlt} | Labels: ${labels}.`;
        });
    </script>
</body>
</html>

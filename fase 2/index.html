<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 02 - Eventos y Teclado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0f14; color: #f8fafc; padding: 20px; font-family: sans-serif; }
        .caja-cancha { background: #121a21; border: 2px solid #2a3744; padding: 20px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .caja-cancha:focus { border-color: #10b981; outline: none; background: #1a2530; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h1 class="text-success">Fase 02: Eventos y Teclado</h1>
        <p>Usa las flechas (Arriba/Abajo) de tu teclado para navegar por las canchas.</p>
        
        <section class="mt-4">
            <div class="caja-cancha" tabindex="0" role="button">
                <h5 class="m-0">Fútbol 5 - Cancha 1</h5>
                <small class="text-muted">Presiona flecha abajo</small>
            </div>
            <div class="caja-cancha" tabindex="0" role="button">
                <h5 class="m-0">Fútbol 7 - Central</h5>
                <small class="text-muted">Presiona flecha arriba o abajo</small>
            </div>
            <div class="caja-cancha" tabindex="0" role="button">
                <h5 class="m-0">Fútbol 11 - Estadio</h5>
                <small class="text-muted">Presiona flecha arriba</small>
            </div>
        </section>
        
        <a href="../index.html" class="btn btn-outline-light mt-4">Volver al Menú</a>
    </main>

    <script>
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const cajas = Array.from(document.querySelectorAll('.caja-cancha'));
                const index = cajas.indexOf(document.activeElement);
                
                if (index > -1) {
                    e.preventDefault();
                    let nextIndex = index;
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIndex = Math.min(index + 1, cajas.length - 1);
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIndex = Math.max(index - 1, 0);
                    cajas[nextIndex].focus();
                }
            }
        });
    </script>
</body>
</html>
